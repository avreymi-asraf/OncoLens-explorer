# A run made to be watched from inside: probes on, sparse metrics rows. Same data, model and label as
# configs/connect.toml (a plumbing label: its numbers are not results).

[data]
study = "msk_chord_2024"
n_patients = 2000
val_fraction = 0.2
seed = 0

[model]
name = "mlp"
hidden = [64, 32]
dropout = 0.1

[train]
steps = 60000
batch_size = 64
lr = 1e-3
weight_decay = 0.0
eval_every = 250
checkpoint_every = 20000
seed = 0

[track]
wandb = true
hub = true
log_every = 25
probe_every = 50
